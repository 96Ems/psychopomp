[package]
name = "kinograph-browser-grid-prototype"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately isolated: not a new supported workspace crate or browser API.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[[bin]]
name = "bake"
path = "src/bake.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
kinograph = { path = "../../crates/kinograph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl", "webgpu", "metal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cosmic-text = "0.19"
kinograph-keyed-grid = { path = "../../scenes/keyed-grid" }
kinograph-opencode-architecture = { path = "../../scenes/opencode-architecture" }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = { version = "=0.3.91", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
