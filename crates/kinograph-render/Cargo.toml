[package]
name = "kinograph-render"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kinograph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
kinograph = { path = "../kinograph" }
pollster = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
png = "0.18"
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30.0"
winit = "0.30"

[dev-dependencies]
kinograph-deployment-queue = { path = "../../scenes/deployment-queue" }
kinograph-opencode-session-tool = { path = "../../scenes/opencode-session-tool" }
kinograph-hero = { path = "../../scenes/hero" }
kinograph-effect-succeed-slides = { path = "../../scenes/effect-succeed-slides" }
kinograph-interactive-showcase = { path = "../../scenes/interactive-showcase" }
kinograph-keyed-grid = { path = "../../scenes/keyed-grid" }
kinograph-data-modeling = { path = "../../scenes/data-modeling" }
kinograph-component-prototypes = { path = "../../scenes/component-prototypes" }
kinograph-opencode-architecture = { path = "../../scenes/opencode-architecture" }
