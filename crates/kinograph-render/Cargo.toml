[package]
name = "kinograph-render"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kinograph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
kinograph = { path = "../kinograph" }
pollster = "0.4"
png = "0.18"
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "30.0"

[dev-dependencies]
kinograph-hero = { path = "../../scenes/hero" }
